<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ensaio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ensaio do Coro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111016'/%3E%3Cpath d='M26 44V18l20-4v26' fill='none' stroke='%23E7B95E' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='44' r='6' fill='%23E7B95E'/%3E%3Ccircle cx='40' cy='40' r='6' fill='%23E7B95E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#111016; --surface:#1B1A22; --surface2:#25242E; --hover:#211F29; --line:#2F2E3A; --line2:#3C3A48;
  --text:#F3EFE7; --muted:#A8A3B3; --faint:#736F7E;
  --accent:#E7B95E; --ink:#1B1406; --accent-soft:rgba(231,185,94,.13); --accent-line:rgba(231,185,94,.32);
  --danger:#E57373;
  --r:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;padding-bottom:calc(140px + var(--sab));-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
svg{width:22px;height:22px;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Topo */
.top{position:sticky;top:0;z-index:20;background:rgba(17,16,22,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:792px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:calc(var(--sat) + 10px) 10px 12px}
.titles{flex:1;min-width:0;padding:0 8px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{margin:2px 0 0;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:background .15s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn:active{background:var(--line)}
.icon-btn:disabled{opacity:.35}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.sm svg{width:19px;height:19px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:rgba(229,115,115,.14);color:var(--danger);flex:none}

main{max-width:792px;margin:0 auto;padding:6px 16px 0}

/* Listas */
.sec-label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:20px 4px 10px}
.sec-label:first-child{margin-top:8px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:background .15s,border-color .15s,transform .1s}
.card:hover{border-color:var(--line2);background:var(--hover)}
.card:active{transform:scale(.99)}
.cal{width:54px;height:58px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.cal .d{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1}
.cal .m{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.card.past .cal{background:var(--surface2);color:var(--muted)}
.card .info{flex:1;min-width:0}
.card .t{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{color:var(--muted);font-size:13.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--faint);display:flex}

.songs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 14px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.num{width:28px;text-align:center;font-family:var(--serif);font-size:18px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.loaded .t{color:var(--accent)}
.badges{display:flex;gap:4px;flex:none}
.b{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 6px;border-radius:6px;color:var(--faint);border:1px solid var(--line)}
.b.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.eq{display:none;width:28px;height:16px;align-items:flex-end;justify-content:center;gap:2px;flex:none}
.eq i{width:3px;height:6px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.45s}
.eq i:nth-child(3){animation-delay:-.75s}
.row.loaded .num{display:none}
.row.loaded .eq{display:flex}
.row.playing .eq i{animation-play-state:running}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ic{width:66px;height:66px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px}
.empty .ic svg{width:30px;height:30px}
.empty h2{font-family:var(--serif);font-weight:600;color:var(--text);font-size:21px;margin:0 0 6px}
.empty p{margin:0 auto;font-size:15px;max-width:340px}

/* Música */
.player{background:linear-gradient(180deg,#23202B,var(--surface));border:1px solid var(--line);border-radius:22px;padding:24px 18px 16px;margin-top:8px}
.transport{display:flex;align-items:center;justify-content:center;gap:28px}
.tbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--surface2);transition:background .15s,transform .1s}
.tbtn:hover{background:var(--line)}
.tbtn:active{transform:scale(.94)}
.tbtn svg{width:25px;height:25px}
.tbtn.sm{width:44px;height:44px}
.tbtn.sm svg{width:22px;height:22px}
.play-big{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--ink);box-shadow:0 12px 32px -10px rgba(231,185,94,.6);transition:transform .1s}
.play-big svg{width:34px;height:34px}
.play-big:active{transform:scale(.95)}
.play-big .spin{width:28px;height:28px;border-width:3px}
.seekrow{display:flex;align-items:center;gap:10px;margin-top:22px}
.time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px}
.time.r{text-align:right}
.status{min-height:18px;text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.noaudio{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:14.5px;flex-wrap:wrap;padding:8px 0}
.noaudio svg{color:var(--faint)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.block h2{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 10px}
.block h2 span{letter-spacing:0;text-transform:none;font-weight:500}
.ch{display:flex;align-items:center;gap:14px;padding:8px 0}
.ch + .ch{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.ch-tg{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;position:relative;transition:background .15s,color .15s}
.ch-tg.muted{background:var(--surface2);color:var(--faint)}
.ch-tg.muted::after{content:"";position:absolute;width:28px;height:2px;background:currentColor;transform:rotate(-45deg);border-radius:2px}
.ch-body{flex:1;min-width:0}
.ch-label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600}
.ch-val{font-weight:500;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ch.na .ch-tg{background:var(--surface2);color:var(--faint);opacity:.6}
.ch-na{font-size:13px;color:var(--faint);margin-top:2px}

.score-open{display:block;width:100%;position:relative;border-radius:14px;overflow:hidden;background:#0B0A0F;padding:18px 18px 0;height:300px;text-align:center}
.thumb{display:block;margin:0 auto;background:#fff;border-radius:3px 3px 0 0;box-shadow:0 10px 34px rgba(0,0,0,.5)}
.score-open::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(rgba(11,10,15,0),rgba(11,10,15,.96));pointer-events:none}
.score-cta{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:1;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--ink);font-weight:600;font-size:15px;padding:12px 20px;border-radius:99px;white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.6)}
.score-cta svg{width:18px;height:18px}
.thumb-ph{height:100%;display:grid;place-items:center;color:var(--faint);font-size:14px}
.foot-actions{display:flex;justify-content:center;gap:10px;margin:22px 0 6px}

/* Controles */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;--p:0%;cursor:pointer;touch-action:pan-y}
input[type=range]:disabled{opacity:.4;cursor:default}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,var(--accent) var(--p),var(--line2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--text);margin-top:-6.5px;box-shadow:0 0 0 5px rgba(231,185,94,.22)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;transition:background .15s,opacity .15s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);color:#1E0B0B}
.btn.sm{height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn.wide{width:100%;margin-top:6px}
.btn:disabled{opacity:.5}
.link{color:var(--accent);font-weight:600}

.fab{position:fixed;right:max(16px,calc(50% - 380px));bottom:calc(20px + var(--sab));z-index:30;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--accent);color:var(--ink);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;box-shadow:0 14px 32px -10px rgba(231,185,94,.55);transition:bottom .25s,transform .1s}
.fab:active{transform:scale(.97)}
body.has-mini .fab{bottom:calc(98px + var(--sab))}

.mini{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--sab));z-index:30;max-width:768px;margin:0 auto;background:rgba(37,36,46,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:18px;display:flex;align-items:center;gap:8px;padding:9px 9px 11px 10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.75);overflow:hidden}
.mini-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.mini-ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mini-tx{min-width:0;display:flex;flex-direction:column}
.mini-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .p-play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;flex:none}
.mini-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.mini-bar i{display:block;height:100%;width:0;background:var(--accent)}

/* Folha (formulários) */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(5,4,8,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--sab));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 16px}
.sheet h3{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 16px}
@media (min-width:700px){.backdrop{align-items:center;padding:20px}.sheet{border-radius:24px;border-bottom:1px solid var(--line2);padding:22px 22px 20px}.grab{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.fld{display:block;margin-bottom:14px;min-width:0}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input{display:block;width:100%;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.fld input:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px}
.actions .sp{flex:1}
.slot{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line2);border-radius:14px;margin-bottom:10px}
.slot.has{border-style:solid;background:rgba(255,255,255,.02)}
.slot-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.slot.has .slot-ic{background:var(--accent-soft);color:var(--accent)}
.slot.rm .slot-ic{background:rgba(229,115,115,.12);color:var(--danger)}
.slot-info{flex:1;min-width:0}
.slot-t{font-weight:600;font-size:15px}
.slot-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.rm .slot-s{color:var(--danger)}
.slot label.btn{cursor:pointer}
.hint{font-size:12.5px;color:var(--faint);margin:2px 2px 0}
.ask-msg{color:var(--muted);font-size:15px;margin:0}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row>div{flex:1;min-width:0}
.set-t{font-weight:600;font-size:15px}
.set-s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* Conexão */
.cfg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:8px}
.step{display:flex;gap:12px;margin-bottom:18px}
.step>div{min-width:0;flex:1}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none;margin-top:1px}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.step b{color:var(--text);font-weight:600}
pre.sql{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;line-height:1.5;max-height:170px;overflow:auto;color:#CFC9D9;margin:12px 0 10px;white-space:pre}
.note{font-size:13px;color:var(--faint);margin:14px 0 0}
.err-box{background:rgba(229,115,115,.1);border:1px solid rgba(229,115,115,.32);color:#F2B8B8;border-radius:12px;padding:11px 13px;font-size:14px;margin:4px 0 12px}

/* Visualizador da partitura */
.viewer{position:fixed;inset:0;z-index:50;background:#08070B}
.v-pages{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sat) + 62px) 8px calc(var(--sab) + 160px)}
.v-page{position:relative;margin:0 auto 12px;background:#fff;box-shadow:0 4px 26px rgba(0,0,0,.55)}
.v-page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.v-page canvas.v-pdf{z-index:0}
.v-page canvas.v-anot{z-index:1;pointer-events:none}
.v-pages{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.v-pages.drawing{touch-action:none;cursor:crosshair}
.v-tools{display:none;flex:1;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.v-tools::-webkit-scrollbar{display:none}
.viewer.drawing .v-tools{display:flex}
.viewer.drawing .v-norm{display:none!important}
.viewer.drawing .v-top{background:rgba(8,7,11,.95);padding-bottom:8px;border-bottom:1px solid var(--line)}
.v-done{height:38px;padding:0 12px 0 9px;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:5px;flex:none}
.v-done svg{width:18px;height:18px}
.sw{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid transparent;transition:border-color .15s}
.sw i{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.sw.on{border-color:var(--text)}
.tool{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:20px;height:20px}
.tool:disabled{opacity:.3}
.v-sep{width:1px;height:22px;background:var(--line2);flex:none;margin:0 3px}
.v-stat{font-size:11px;line-height:1.15;color:var(--faint);max-width:70px;text-align:right;margin-left:auto;padding:0 4px 0 6px;flex:none}
@media (max-width:420px){.v-tools{gap:2px}.sw{width:30px;height:30px}.tool{width:34px;height:34px}.v-done{padding:0 10px 0 8px}.v-sep{margin:0 2px}}
.v-stat.err{color:var(--danger)}
.v-loading{height:70vh;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:15px}
.v-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:2px;padding:calc(var(--sat) + 8px) 8px 28px;background:linear-gradient(rgba(8,7,11,.94),rgba(8,7,11,0));transition:opacity .25s,transform .25s}
.v-title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.v-pg{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 6px;white-space:nowrap}
.v-bot{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:8px 14px calc(var(--sab) + 12px);background:rgba(22,21,28,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);transition:opacity .25s,transform .25s}
.v-bot-in{max-width:768px;margin:0 auto}
.v-bot .seekrow{margin-top:0}
.v-ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:4px}
.v-chips{display:flex;gap:6px;min-width:0}
.v-trans{display:flex;align-items:center;gap:12px}
.v-play{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;transition:transform .1s}
.v-play:active{transform:scale(.95)}
.v-play svg{width:26px;height:26px}
.chip{height:32px;padding:0 9px;border-radius:10px;font-size:11.5px;font-weight:700;letter-spacing:.04em;display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);transition:all .15s}
.chip.muted{background:transparent;color:var(--faint);border-color:var(--line2);text-decoration:line-through}
.chip:disabled{opacity:.25;text-decoration:none}
.viewer.hide-ui .v-top{opacity:0;transform:translateY(-100%);pointer-events:none}
.viewer.hide-ui .v-bot{opacity:0;transform:translateY(100%);pointer-events:none}

.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;display:inline-block;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.busy{position:fixed;inset:0;z-index:80;background:rgba(5,4,8,.55);display:grid;place-items:center;padding:20px}
.busy-card{background:var(--surface2);border:1px solid var(--line2);border-radius:16px;padding:18px 22px;display:flex;align-items:center;gap:14px;font-weight:500}
.busy-card .spin{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--sab));transform:translate(-50%,16px);opacity:0;z-index:90;background:#2E2C38;border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#3A2226;border-color:#5C3138}

@media (max-width:380px){
  .top h1{font-size:23px}
  .transport{gap:20px}
  .v-trans{gap:8px}
  .tbtn.sm{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>

<header class="top" id="top">
  <div class="top-in">
    <button class="icon-btn" id="btnBack" aria-label="Voltar" data-i="back" hidden></button>
    <div class="titles">
      <div class="eyebrow" id="eyebrow">Ensaio do Coro</div>
      <h1 id="title">Apresentações</h1>
    </div>
    <span class="pill" id="offPill" hidden>OFFLINE</span>
    <button class="icon-btn" id="btnAct" hidden></button>
  </div>
</header>

<main id="view"></main>

<button class="fab" id="fab" data-i="plus" hidden><span id="fabLabel"></span></button>

<div class="mini pctl" id="mini" hidden>
  <button class="mini-main" data-act="open-current" aria-label="Abrir música que está tocando">
    <span class="mini-ic" data-i="note"></span>
    <span class="mini-tx"><span class="mini-t"></span><span class="mini-s"></span></span>
  </button>
  <button class="p-play" data-act="toggle" aria-label="Tocar"></button>
  <span class="mini-bar"><i class="p-bar"></i></span>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="v-pages" id="vPages"></div>
  <div class="v-top">
    <button class="icon-btn v-norm" data-act="vclose" data-i="close" aria-label="Fechar partitura"></button>
    <div class="v-title v-norm" id="vTitle"></div>
    <span class="v-pg v-norm" id="vPg"></span>
    <button class="icon-btn v-norm" data-act="vdraw" data-i="pen" aria-label="Anotar na partitura" title="Anotar"></button>
    <button class="icon-btn v-norm" id="vZoomOut" data-act="vzout" data-i="zout" aria-label="Diminuir zoom"></button>
    <button class="icon-btn v-norm" id="vZoomIn" data-act="vzin" data-i="zin" aria-label="Aumentar zoom"></button>
    <button class="icon-btn v-norm" id="vFs" data-act="vfs" aria-label="Tela cheia"></button>
    <div class="v-tools">
      <button class="v-done" data-act="vdone" data-i="check">Pronto</button>
      <span class="v-sep"></span>
      <button class="sw on" data-act="vtool" data-tool="pen" data-color="#E53935" style="--c:#E53935" aria-label="Caneta vermelha"><i></i></button>
      <button class="sw" data-act="vtool" data-tool="pen" data-color="#2F6FED" style="--c:#2F6FED" aria-label="Caneta azul"><i></i></button>
      <button class="sw" data-act="vtool" data-tool="pen" data-color="#1A1A1A" style="--c:#1A1A1A" aria-label="Caneta preta"><i></i></button>
      <button class="tool" data-act="vtool" data-tool="hl" data-i="marker" aria-label="Marca-texto"></button>
      <button class="tool" data-act="vtool" data-tool="erase" data-i="eraser" aria-label="Borracha"></button>
      <span class="v-sep"></span>
      <button class="tool" id="vUndo" data-act="vundo" data-i="undo" aria-label="Desfazer" disabled></button>
      <span class="v-stat" id="vStat"></span>
    </div>
  </div>
  <div class="v-bot pctl" id="vBot">
    <div class="v-bot-in">
      <div class="seekrow">
        <span class="time p-cur">0:00</span>
        <input type="range" class="p-seek" min="0" max="1000" step="1" value="0" aria-label="Andamento da música">
        <span class="time r p-dur">--:--</span>
      </div>
      <div class="v-ctrl">
        <div class="v-chips">
          <button class="chip" data-act="mute" data-k="bg" aria-label="Ligar ou silenciar o BG">BG</button>
          <button class="chip" data-act="mute" data-k="voz" aria-label="Ligar ou silenciar a voz">VOZ</button>
        </div>
        <div class="v-trans">

          <button class="v-play p-play" data-act="toggle" aria-label="Tocar"></button>
          <button class="tbtn sm" data-act="fwd" data-i="fwd5" aria-label="Avançar 5 segundos"></button>

        <div></div>

    </div>

</div>

<div class="busy" id="busy" hidden><div class="busy-card"><span class="spin"></span><span id="busyMsg"></span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- Constantes ---------- */
const BUCKET = 'coro';
const T_AP = 'coro_apresentacoes';
const T_MU = 'coro_musicas';
const LS_CFG = 'coro.cfg', LS_CACHE = 'coro.cache', LS_MIX = 'coro.mix.', LS_ANOT = 'coro.anot.';
const MAX_MB = 50;
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const LABEL = { bg: 'Base (BG)', voz: 'Minha voz', pdf: 'Partitura' };
const ZOOMS = [1, 1.25, 1.5, 2, 2.5, 3];

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const SQL = `-- Ensaio do Coro: estrutura no Supabase
-- Rode uma vez no SQL Editor do projeto.
-- O acesso fica liberado para quem tiver a chave pública do projeto.

create table if not exists public.coro_apresentacoes (
  id uuid primary key default gen_random_uuid(),
  nome text not null,
  data date,
  local text,
  criado_em timestamptz not null default now()
);

create table if not exists public.coro_musicas (
  id uuid primary key default gen_random_uuid(),
  apresentacao_id uuid not null references public.coro_apresentacoes(id) on delete cascade,
  titulo text not null,
  bg_path text,
  voz_path text,
  pdf_path text,
  criado_em timestamptz not null default now()
);

create index if not exists coro_musicas_apresentacao_idx
  on public.coro_musicas (apresentacao_id);

alter table public.coro_apresentacoes enable row level security;
alter table public.coro_musicas enable row level security;

grant select, insert, update, delete on public.coro_apresentacoes to anon, authenticated;
grant select, insert, update, delete on public.coro_musicas to anon, authenticated;

drop policy if exists coro_apresentacoes_acesso on public.coro_apresentacoes;
create policy coro_apresentacoes_acesso on public.coro_apresentacoes
  for all to anon, authenticated using (true) with check (true);

drop policy if exists coro_musicas_acesso on public.coro_musicas;
create policy coro_musicas_acesso on public.coro_musicas
  for all to anon, authenticated using (true) with check (true);

-- Bucket privado para MP3 e PDF (até 50 MB por arquivo)
insert into storage.buckets (id, name, public, file_size_limit)
values ('coro', 'coro', false, 52428800)
on conflict (id) do nothing;

drop policy if exists coro_arquivos_ler on storage.objects;
create policy coro_arquivos_ler on storage.objects
  for select to anon, authenticated using (bucket_id = 'coro');

drop policy if exists coro_arquivos_enviar on storage.objects;
create policy coro_arquivos_enviar on storage.objects
  for insert to anon, authenticated with check (bucket_id = 'coro');

drop policy if exists coro_arquivos_alterar on storage.objects;
create policy coro_arquivos_alterar on storage.objects
  for update to anon, authenticated
  using (bucket_id = 'coro') with check (bucket_id = 'coro');

drop policy if exists coro_arquivos_apagar on storage.objects;
create policy coro_arquivos_apagar on storage.objects
  for delete to anon, authenticated using (bucket_id = 'coro');
`;

/* ---------- Ícones ---------- */
const ICONS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  edit: '<path d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  play: '<path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.2-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z" fill="currentColor" stroke="none"/>',
  pause: '<rect x="6.5" y="5" width="4" height="14" rx="1.3" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1.3" fill="currentColor" stroke="none"/>',
  rew5: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.6" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif">5</text>',
  fwd5: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.6" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif">5</text>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  zin: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M11 8v6M8 11h6"/>',
  zout: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8 11h6"/>',
  expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  shrink: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
  note: '<path d="M9 18V5.5l11-2V16"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  wave: '<path d="M3 12h1.5M6.5 9v6M10 5v14M13.5 8v8M17 10.5v3M20.5 12H21"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  marker: '<path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',
  eraser: '<path d="M7 21l-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'
};
const I = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function parseData(d) { if (!d) return null; const [y, m, dd] = String(d).split('-').map(Number); if (!y || !m || !dd) return null; return new Date(y, m - 1, dd); }
function fmtData(d) { const dt = parseData(d); return dt ? `${dt.getDate()} ${MESES[dt.getMonth()]} ${dt.getFullYear()}` : ''; }
function fmtT(s) { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtMB(b) { return (b / 1048576).toFixed(1).replace('.', ',') + ' MB'; }
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function extOf(file, k) { const m = file.name.match(/\.([a-z0-9]{1,5})$/i); return m ? m[1].toLowerCase() : (k === 'pdf' ? 'pdf' : 'mp3'); }
function errMsg(e, fb) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e || '');
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sem conexão com o Supabase. Verifique a internet.';
  if (/maximum allowed size|Payload too large|413/i.test(m)) return `Arquivo acima do limite de ${MAX_MB} MB.`;
  if (/Bucket not found/i.test(m)) return 'Bucket "coro" não encontrado. Rode o script SQL.';
  if (/row-level security|violates|permission denied|Unauthorized|403/i.test(m)) return 'Sem permissão no Supabase. Rode o script SQL de novo.';
  if (/Invalid API key|JWT|apikey/i.test(m)) return 'Chave do Supabase inválida.';
  if (/Invalid supabaseUrl|Invalid URL/i.test(m)) return 'URL do Supabase inválida.';
  return fb || m || 'Algo deu errado.';
}
let toastT;
function toast(msg, type) {
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (type === 'err' ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => { el.className = 'toast'; }, type === 'err' ? 4500 : 2400);
}
function busy(msg) { const el = $('#busy'); if (!msg) { el.hidden = true; return; } $('#busyMsg').textContent = msg; el.hidden = false; }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('SQL copiado'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('SQL copiado'); } catch (e2) { toast('Não foi possível copiar', 'err'); }
    ta.remove();
  }
}

/* ---------- Cache local (IndexedDB) ---------- */
const idb = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('ensaio-coro', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const tx = async (mode, fn) => {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const t = db.transaction('files', mode); const rq = fn(t.objectStore('files'));
        t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    } catch (e) { return null; }
  };
  return {
    get: k => tx('readonly', s => s.get(k)),
    set: (k, v) => tx('readwrite', s => s.put(v, k)),
    del: k => tx('readwrite', s => s.delete(k)),
    clear: () => tx('readwrite', s => s.clear())
  };
})();

/* ---------- Estado ---------- */
const S = { sb: null, cfg: null, apres: [], mus: [], offline: false, viewKey: '', route: { name: 'home' }, viewerOpen: false };
const view = $('#view');
const findApres = id => S.apres.find(a => a.id === id);
const findMus = id => S.mus.find(m => m.id === id);
const songsOf = aid => S.mus.filter(m => m.apresentacao_id === aid);

function makeClient(url, key) {
  return supabase.createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
}
function setOffline(b) { S.offline = b; $('#offPill').hidden = !b; }

async function loadAll() {
  if (!S.sb) return false;
  try {
    const [a, m] = await Promise.all([
      S.sb.from(T_AP).select('*').order('criado_em', { ascending: true }),
      S.sb.from(T_MU).select('*').order('criado_em', { ascending: true })
    ]);
    if (a.error) throw a.error;
    if (m.error) throw m.error;
    const changed = JSON.stringify([a.data, m.data]) !== JSON.stringify([S.apres, S.mus]);
    S.apres = a.data || []; S.mus = m.data || [];
    try { localStorage.setItem(LS_CACHE, JSON.stringify({ apres: S.apres, mus: S.mus })); } catch (e) {}
    setOffline(false);
    return changed;
  } catch (e) {
    console.warn(e); setOffline(true); return false;
  }
}

/* ---------- Arquivos ---------- */
const inflight = new Map();
function getFile(path) {
  if (inflight.has(path)) return inflight.get(path);
  const pr = (async () => {
    const c = await idb.get(path);
    if (c && c.size) return c;
    if (!S.sb) throw new Error('Failed to fetch');
    const { data, error } = await S.sb.storage.from(BUCKET).download(path);
    if (error) throw error;
    idb.set(path, data);
    return data;
  })();
  inflight.set(path, pr);
  pr.finally(() => inflight.delete(path)).catch(() => {});
  return pr;
}
const pdfCache = new Map();
function getPdf(path) {
  if (!window.pdfjsLib) return Promise.reject(new Error('O leitor de PDF não carregou. Verifique a internet.'));
  if (pdfCache.has(path)) { const v = pdfCache.get(path); pdfCache.delete(path); pdfCache.set(path, v); return v; }
  const pr = (async () => {
    const b = await getFile(path);
    const buf = new Uint8Array(await b.arrayBuffer());
    return pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
  })();
  pdfCache.set(path, pr);
  pr.catch(() => pdfCache.delete(path));
  while (pdfCache.size > 3) {
    const k = pdfCache.keys().next().value; const v = pdfCache.get(k); pdfCache.delete(k);
    v.then(d => d.destroy()).catch(() => {});
  }
  return pr;
}
function dropPdf(path) { const v = pdfCache.get(path); if (v) { pdfCache.delete(path); v.then(d => d.destroy()).catch(() => {}); } }
function forgetFile(path) { idb.del(path); dropPdf(path); try { localStorage.removeItem(LS_ANOT + path); } catch (e) {} if (typeof anotQueue !== 'undefined') anotQueue.delete(path); }

/* ---------- Mixer (volume por música) ---------- */
function getMix(id) {
  try { const v = JSON.parse(localStorage.getItem(LS_MIX + id)); if (v && v.bg && v.voz) return v; } catch (e) {}
  return { bg: { vol: 100, on: true }, voz: { vol: 80, on: true } };
}
function setMix(id, mix) {
  try { localStorage.setItem(LS_MIX + id, JSON.stringify(mix)); } catch (e) {}
  if (P.musica && P.musica.id === id) applyMix();
  refreshMixUI(id);
}
function refreshMixUI(id) {
  const mix = getMix(id);
  for (const ch of $$('.ch[data-song]')) {
    if (ch.dataset.song !== id) continue;

async function renderThumb(m) {
  const cv = $('#thumb'), ph = $('#thumbPh'); if (!cv) return;
  try {
    const pdf = await getPdf(m.pdf_path);

    if (!cv.isConnected) return;
    const pc = $('#pgCount'); if (pc) pc.textContent = pdf.numPages + (pdf.numPages === 1 ? ' página' : ' páginas');
    const w = Math.max(120, Math.min(cv.parentElement.clientWidth - 36, 440));
    const vp1 = page.getViewport({ scale: 1 }); const sc = w / vp1.width;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({ scale: sc * dpr });
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.width = w + 'px'; cv.style.height = (vp1.height * sc) + 'px';
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    if (!cv.isConnected) return;
    const loc = anotLocal(anotPathOf(m)), p1 = loc && loc.d && loc.d.pages && loc.d.pages['1'];
    if (p1) { const ctx = cv.getContext('2d'); for (const st of p1) drawStroke(ctx, st, cv.width); }
    ph.hidden = true; cv.hidden = false;
  } catch (e) {
    console.warn(e);

  }
}

const V = { song: null, pdf: null, pages: [], gen: 0, zoom: 0, io: null, hideT: 0, wake: null, dragging: false, scrollRaf: 0, anot: { v: 1, pages: {} }, anotPath: null, undo: [] };
const vPages = $('#vPages');
function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
function fsSupported() { const d = document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen); }
function enterFs() {
  try {
    if (fsEl()) return;
    const d = document.documentElement, fn = d.requestFullscreen || d.webkitRequestFullscreen;
    if (fn) { const r = fn.call(d); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
}
function exitFs() {

    if (!fsEl()) return;

}

document.addEventListener('fullscreenchange', updFsBtn);

function releaseWake() { try { if (V.wake) V.wake.release(); } catch (e) {} V.wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.viewerOpen) requestWake(); });

async function loadViewerPdf(m) {
  const gen = ++V.gen;
  vPages.innerHTML = '<div class="v-loading"><span class="spin"></span>Carregando partitura…</div>';
  $('#vPg').textContent = '';
  try {
    const pdf = await getPdf(m.pdf_path); if (gen !== V.gen) return;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i); if (gen !== V.gen) return;
      const vp = page.getViewport({ scale: 1 });
      pages.push({ n: i, page, w: vp.width, h: vp.height, el: null, cv: null, ov: null, ovW: 0, cssW: 0, rw: 0, pend: 0, task: null });
    }

    for (const p of pages) { const d = document.createElement('div'); d.className = 'v-page'; d.dataset.n = p.n; vPages.appendChild(d); p.el = d; }
    V.pages = pages; layoutPages(); vPages.scrollTop = 0;

    history.replaceState(null, '', location.pathname + location.search + '#/');
    NAV[0] = '#/';
  }
  try { S.cfg = JSON.parse(localStorage.getItem(LS_CFG)); } catch (e) { S.cfg = null; }
  if (S.cfg && !(S.cfg.url && S.cfg.key)) S.cfg = null;
  try { const c = JSON.parse(localStorage.getItem(LS_CACHE)); if (c) { S.apres = c.apres || []; S.mus = c.mus || []; } } catch (e) {}
  if (S.cfg) {
    if (window.supabase) { try { S.sb = makeClient(S.cfg.url, S.cfg.key); } catch (e) { S.cfg = null; } }
    else setOffline(true);
  }
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(LS_ANOT) === 0) { const v = anotLocal(k.slice(LS_ANOT.length)); if (v && v.pending && v.d) anotQueue.set(k.slice(LS_ANOT.length), v.d); }
    }
  } catch (e) {}
  window.addEventListener('hashchange', onHash);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  route();
  if (S.sb) loadAll().then(ch => {
    if (ch) route(true);
    anotFlush();
    if (viaLink) toast(S.offline ? 'Configuração salva, mas o Supabase não respondeu.' : 'Aparelho conectado ao Supabase', S.offline ? 'err' : '');
  });
}
init();
})();
</script>
